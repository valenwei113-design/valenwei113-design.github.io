<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valen Wei</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.8s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }


    @keyframes fadeBlur {
      from { opacity: 0; filter: blur(6px); letter-spacing: 0.18em; }
      to   { opacity: 1; filter: blur(0);   letter-spacing: 0.04em; }
    }
    .fade-blur {
      opacity: 0;
      animation: fadeBlur 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes nameReveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .name-reveal {
      opacity: 0;
      animation: nameReveal 1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    #music-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 50;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #music-btn:hover {
      border-color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.4);
    }
    #music-btn.playing #vinyl {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #music-label {
      position: fixed;
      bottom: 30px;
      left: 68px;
      z-index: 50;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }
    #music-label.visible { opacity: 1; }

  </style>
</head>
<body class="bg-black h-screen overflow-hidden">

  <main class="relative h-screen w-full overflow-hidden">

    <!-- Full-screen video backgrounds -->
    <video id="bg-vid-0" muted playsinline preload="auto" poster="home/jacaranda-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:1;">
      <source src="home/jacaranda.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-1" muted playsinline preload="none"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;">
      <source src="home/norway.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-2" muted playsinline preload="none"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;">
      <source src="home/Manta.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-3" muted playsinline preload="none"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;">
      <source src="home/diving.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-4" muted playsinline preload="none"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;">
      <source src="home/stavanger.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-5" muted playsinline preload="none"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;">
      <source src="home/iceland.mp4" type="video/mp4" />
    </video>


    <!-- Gradient overlays -->
    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%); z-index:1;"></div>
    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 35%); z-index:1;"></div>

    <!-- Quote — top left -->
    <p class="fade-blur absolute top-9 left-10 text-white/50 text-2xl"
       style="font-family:'Great Vibes',cursive; animation-delay:0.9s; z-index:2;">Courage is fear walking</p>


    <!-- Bottom left: identity -->
    <div class="absolute left-10 flex flex-col" style="bottom: 72px; z-index:3;">
      <h1 class="name-reveal text-white font-normal"
          style="font-family:'Playfair Display',serif; font-size:clamp(26px,3.5vw,46px); letter-spacing:0.18em; animation-delay:0.35s;">
        <a href="journey.html" style="color:#fff; text-decoration:none;">VALEN WEI</a>
      </h1>
      <p class="name-reveal text-white/40 font-light text-xs mt-2"
         style="letter-spacing:0.32em; animation-delay:0.55s;">
        LIVING SLOWLY &nbsp;·&nbsp; MOVING FREELY
      </p>
      <a href="services.html" class="name-reveal font-light text-xs mt-4"
         style="color:rgba(255,255,255,0.25); letter-spacing:0.2em; animation-delay:0.7s; text-decoration:none; transition:color 0.3s;"
         onmouseenter="this.style.color='rgba(255,255,255,0.55)'"
         onmouseleave="this.style.color='rgba(255,255,255,0.25)'">
        SERVICES →
      </a>
    </div>


  </main>

  <!-- Background music -->
  <audio id="bg-music" loop preload="none">
    <source src="home/Ellie Goulding-How Long Will I Love You.mp3" type="audio/mpeg" />
  </audio>

  <button id="music-btn" onclick="toggleMusic()" title="Toggle music">
    <svg id="vinyl" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="7" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <circle cx="8" cy="8" r="2.5" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <circle cx="8" cy="8" r="1" fill="rgba(255,255,255,0.5)"/>
    </svg>
  </button>
  <span id="music-label">How Long Will I Love You — Ellie Goulding</span>

  <script>
    // Video slideshow — each video plays to end then switches to next.
    // Only the first video preloads; the next one starts loading while the
    // current one plays. The current frame stays visible until the next video
    // is actually playing, and videos that fail or stall are skipped.
    const videos = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('bg-vid-' + i));
    const failed = new Set();
    const STALL_MS = 15000;
    let curIdx = 0;
    let pendingIdx = null;
    let watchdog = null;

    function preload(v) {
      if (v.preload !== 'auto') {
        v.preload = 'auto';
        v.load();
      }
    }

    function nextIdx(from) {
      for (let s = 1; s <= videos.length; s++) {
        const i = (from + s) % videos.length;
        if (!failed.has(i)) return i;
      }
      return -1;
    }

    function playVideo(idx) {
      if (idx < 0) return;
      const v = videos[idx];
      pendingIdx = idx;
      preload(v);
      if (v.readyState > 0) v.currentTime = 0;
      clearTimeout(watchdog);
      watchdog = setTimeout(() => skip(idx), STALL_MS);
      v.play().catch(() => {});
    }

    function skip(idx) {
      if (idx !== pendingIdx) return;
      videos[idx].pause();
      const n = nextIdx(idx);
      if (n !== idx) playVideo(n);
    }

    function fail(idx) {
      if (failed.has(idx)) return;
      failed.add(idx);
      skip(idx);
    }

    videos.forEach((v, i) => {
      v.addEventListener('playing', () => {
        if (i !== pendingIdx) return;
        clearTimeout(watchdog);
        pendingIdx = null;
        curIdx = i;
        videos.forEach((w, j) => { w.style.opacity = j === i ? '1' : '0'; });
        const n = nextIdx(i);
        if (n >= 0) preload(videos[n]);
        startMusic();
      });
      v.addEventListener('ended', () => {
        if (i === curIdx) playVideo(nextIdx(i));
      });
      v.addEventListener('error', () => fail(i));
      v.querySelector('source').addEventListener('error', () => fail(i));
    });

    playVideo(0);

    // Music — loads only after the first video is playing, so it doesn't
    // compete with it for bandwidth
    const audio = document.getElementById('bg-music');
    const btn   = document.getElementById('music-btn');
    const label = document.getElementById('music-label');
    let musicStarted = false;

    audio.volume = 0.35;

    // Fallback in case no video manages to play
    setTimeout(startMusic, STALL_MS);

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;
      audio.play().then(() => {
        btn.classList.add('playing');
        label.classList.add('visible');
        setTimeout(() => label.classList.remove('visible'), 3000);
      }).catch(() => {
        document.addEventListener('click', () => {
          audio.play();
          btn.classList.add('playing');
        }, { once: true });
      });
    }

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
        btn.classList.add('playing');
        label.classList.add('visible');
        setTimeout(() => label.classList.remove('visible'), 3000);
      } else {
        audio.pause();
        btn.classList.remove('playing');
        label.classList.remove('visible');
      }
    }
  </script>
</body>
</html>
