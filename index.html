<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valen Wei</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.8s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }


    @keyframes fadeBlur {
      from { opacity: 0; filter: blur(6px); letter-spacing: 0.18em; }
      to   { opacity: 1; filter: blur(0);   letter-spacing: 0.04em; }
    }
    .fade-blur {
      opacity: 0;
      animation: fadeBlur 1.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes nameReveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .name-reveal {
      opacity: 0;
      animation: nameReveal 1s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    #music-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 50;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #music-btn:hover {
      border-color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.4);
    }
    #music-btn.playing #vinyl {
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #music-label {
      position: fixed;
      bottom: 30px;
      left: 68px;
      z-index: 50;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }
    #music-label.visible { opacity: 1; }

  </style>
</head>
<body class="bg-black h-screen overflow-hidden">

  <main class="relative h-screen w-full overflow-hidden">

    <!-- Full-screen video backgrounds -->
    <video id="bg-vid-0" autoplay muted playsinline preload="auto" poster="home/jacaranda-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:1;">
      <source src="home/jacaranda.mp4" type="video/mp4" />
    </video>
    <video id="bg-vid-1" muted playsinline preload="none" data-src="home/norway.mp4" data-poster="home/norway-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;"></video>
    <video id="bg-vid-2" muted playsinline preload="none" data-src="home/Manta.mp4" data-poster="home/Manta-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;"></video>
    <video id="bg-vid-3" muted playsinline preload="none" data-src="home/diving.mp4" data-poster="home/diving-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;"></video>
    <video id="bg-vid-4" muted playsinline preload="none" data-src="home/stavanger.mp4" data-poster="home/stavanger-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;"></video>
    <video id="bg-vid-5" muted playsinline preload="none" data-src="home/iceland.mp4" data-poster="home/iceland-poster.jpg"
           class="absolute inset-0 w-full h-full object-cover transition-opacity duration-[1500ms]" style="opacity:0;"></video>


    <!-- Gradient overlays -->
    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%); z-index:1;"></div>
    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 35%); z-index:1;"></div>

    <!-- Quote — top left -->
    <p class="fade-blur absolute top-9 left-10 text-white/50 text-2xl"
       style="font-family:'Great Vibes',cursive; animation-delay:0.9s; z-index:2;">Courage is fear walking</p>


    <!-- Bottom left: identity -->
    <div class="absolute left-10 flex flex-col" style="bottom: 72px; z-index:3;">
      <h1 class="name-reveal text-white font-normal"
          style="font-family:'Playfair Display',serif; font-size:clamp(26px,3.5vw,46px); letter-spacing:0.18em; animation-delay:0.35s;">
        <a href="journey.html" style="color:#fff; text-decoration:none;">VALEN WEI</a>
      </h1>
      <p class="name-reveal text-white/40 font-light text-xs mt-2"
         style="letter-spacing:0.32em; animation-delay:0.55s;">
        LIVING SLOWLY &nbsp;·&nbsp; MOVING FREELY
      </p>
      <a href="services.html" class="name-reveal font-light text-xs mt-4"
         style="color:rgba(255,255,255,0.25); letter-spacing:0.2em; animation-delay:0.7s; text-decoration:none; transition:color 0.3s;"
         onmouseenter="this.style.color='rgba(255,255,255,0.55)'"
         onmouseleave="this.style.color='rgba(255,255,255,0.25)'">
        SERVICES →
      </a>
    </div>


  </main>

  <!-- Background music -->
  <audio id="bg-music" loop preload="none">
    <source src="home/Ellie Goulding-How Long Will I Love You.mp3" type="audio/mpeg" />
  </audio>

  <button id="music-btn" onclick="toggleMusic()" title="Toggle music">
    <svg id="vinyl" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="7" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <circle cx="8" cy="8" r="2.5" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <circle cx="8" cy="8" r="1" fill="rgba(255,255,255,0.5)"/>
    </svg>
  </button>
  <span id="music-label">How Long Will I Love You — Ellie Goulding</span>

  <script>
    // Video slideshow — each video plays to end then switches to next
    const videos = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('bg-vid-' + i));
    let curIdx = 0;

    // Lazy loading — only the first video loads up front; the rest get their src on demand
    function loadVideo(v) {
      if (!v.dataset.src) return;
      v.poster = v.dataset.poster;
      v.src = v.dataset.src;
      v.removeAttribute('data-src');
      v.preload = 'auto';
      v.load();
    }

    function isBuffered(v) {
      return v.buffered.length > 0 && v.duration > 0 &&
             v.buffered.end(v.buffered.length - 1) >= v.duration - 0.1;
    }

    // Prefetch the next video once the current one is fully buffered (or half played)
    function whenReady(v, fn) {
      let done = false;
      const check = () => {
        if (done) return;
        if (isBuffered(v) || (v.duration > 0 && v.currentTime >= v.duration / 2)) {
          done = true;
          v.removeEventListener('progress', check);
          v.removeEventListener('timeupdate', check);
          fn();
        }
      };
      v.addEventListener('progress', check);
      v.addEventListener('timeupdate', check);
      check();
    }

    function showVideo(idx) {
      loadVideo(videos[idx]);
      videos.forEach((v, i) => { v.style.opacity = i === idx ? '1' : '0'; });
      videos[idx].play().catch(() => {});
      videos[idx].onended = () => {
        curIdx = (curIdx + 1) % videos.length;
        showVideo(curIdx);
      };
      whenReady(videos[idx], () => loadVideo(videos[(idx + 1) % videos.length]));
    }

    showVideo(0);

    // Music
    const audio = document.getElementById('bg-music');
    const btn   = document.getElementById('music-btn');
    const label = document.getElementById('music-label');

    audio.volume = 0.35;

    // Music is preload="none"; try autoplay only after the first video has buffered
    // so the mp3 doesn't compete with it for bandwidth
    let musicTouched = false;
    window.addEventListener('load', () => whenReady(videos[0], () => {
      if (musicTouched) return;
      audio.play().then(() => {
        btn.classList.add('playing');
        label.classList.add('visible');
        setTimeout(() => label.classList.remove('visible'), 3000);
      }).catch(() => {
        document.addEventListener('click', () => {
          audio.play();
          btn.classList.add('playing');
        }, { once: true });
      });
    }));

    function toggleMusic() {
      musicTouched = true;
      if (audio.paused) {
        audio.play();
        btn.classList.add('playing');
        label.classList.add('visible');
        setTimeout(() => label.classList.remove('visible'), 3000);
      } else {
        audio.pause();
        btn.classList.remove('playing');
        label.classList.remove('visible');
      }
    }
  </script>
</body>
</html>
